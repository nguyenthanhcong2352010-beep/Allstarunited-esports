<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLSTAR UNITED ESPORTS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ALLSTAR UNITED ESPORTS</h1>
    <p>Official Fan Page</p>
</header>

<div class="container">

<div class="card" onclick="showPlayer('PER','Đội trưởng (Captain)','Rusher','Điền họ tên','Điền tuổi')">
<h2>PER</h2>
<p>RUSHER (CAP)</p>
</div>

<div class="card" onclick="showPlayer('KEN','Support','Support','Điền họ tên','Điền tuổi')">
<h2>KEN</h2>
<p>SUPPORT</p>
</div>

<div class="card" onclick="showPlayer('MANJIRO','Support','Support','Điền họ tên','Điền tuổi')">
<h2>MANJIRO</h2>
<p>SUPPORT</p>
</div>

<div class="card" onclick="showPlayer('ANH KHOA','Bommer','Bommer','Điền họ tên','Điền tuổi')">
<h2>ANH KHOA</h2>
<p>BOMMER</p>
</div>

<div class="card" onclick="showPlayer('NOTAR7','Bommer','Bommer','Điền họ tên','Điền tuổi')">
<h2>NOTAR7</h2>
<p>BOMMER</p>
</div>

</div>

<div id="popup" class="popup">
<div class="popup-content">
<span class="close" onclick="closePopup()">×</span>

<h2 id="name"></h2>

<p><b>Họ và tên:</b> <span id="fullname"></span></p>
<p><b>Tuổi:</b> <span id="age"></span></p>
<p><b>Vai trò:</b> <span id="role"></span></p>
<p><b>Chức vụ:</b> <span id="position"></span></p>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
